theme: dark
openai:
  model: deepseek-v4-pro
  temperature: 0.7
skills_paths:
  - ./skills
log_level: info

agent:
  large_model:
    provider: deepseek
    model: deepseek-v4-pro
  small_model:
    provider: deepseek
    model: deepseek-v4-pro

providers:
  - type: openai
    name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
api_key: DEEPSEEK_API_KEY

models:
  default: deepseek-chat
  scenarios:
    chat: deepseek-chat
    summarize: deepseek-summary
    initialize: deepseek-summary
  items:
    deepseek-chat:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.3
      top_p: 1.0
      max_tokens: 4096
      input_per_1m: 0.14
      output_per_1m: 0.28
    deepseek-summary:
      provider: deepseek
      model: deepseek-v4-pro
      temperature: 0.1
      top_p: 1.0
      max_tokens: 2048
      input_per_1m: 0.14
      output_per_1m: 0.28

context:
  window_tokens: 128000
  large_window_buffer: 20000
  small_window_ratio: 0.2
  summary_model: deepseek-summary
  memory_max_bytes: 102400

session:
  idle_timeout: 30m
  max_sessions: 10

permission:
  default_level: 1
  file_whitelist:
    - "/tmp/"
    - "./"
  cmd_whitelist:
    - "go build"
    - "go test"
    - "go vet"
    - "ls"
    - "cat"

summary_prompt: "请用简洁的语言总结以下对话的关键要点，保留所有技术细节。"

# LSP 服务器配置：为 AI 提供代码诊断反馈
lsp:
  gopls:
    command: gopls
    args: ["serve"]
    file_types: [".go"]
    root_markers: ["go.mod"]
    max_concurrent_requests: 10
    disabled: false

# MCP 服务器配置：连接外部工具生态
# type: http 表示 Streamable HTTP；type: sse 表示旧版 HTTP+SSE
mcp:
  hn-mcp-server:
    type: http
    url: https://hn.caseyjhand.com/mcp
    timeout: 30

version: 2

project_name: aicodeagent

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions && go run ./cmd/AICodeAgent completion bash > completions/aicodeagent.bash'
    - sh -c 'go run ./cmd/AICodeAgent completion zsh > completions/aicodeagent.zsh'
    - sh -c 'go run ./cmd/AICodeAgent completion fish > completions/aicodeagent.fish'

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.CommitSHA={{.Commit}}
      - -X main.BuildDate={{.Date}}
    main: ./cmd/AICodeAgent

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - completions/aicodeagent.bash
      - completions/aicodeagent.zsh
      - completions/aicodeagent.fish

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: "^feat.*"
    - title: Bug Fixes
      regexp: "^fix.*"
    - title: Documentation
      regexp: "^docs.*"

sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source

nfpms:
  - formats:
      - deb
      - rpm
      - apk
    maintainer: "AICodeAgent Team"
    description: "Terminal-native AI coding agent built with Go"
    license: MIT
    contents:
      - src: completions/aicodeagent.bash
        dst: /etc/bash_completion.d/aicodeagent
      - src: completions/aicodeagent.zsh
        dst: /usr/share/zsh/site-functions/_aicodeagent
      - src: completions/aicodeagent.fish
        dst: /usr/share/fish/completions/aicodeagent.fish

brews:
  - token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    repository:
      owner: jseko
      name: homebrew-tap
    homepage: "https://github.com/jseko/aicodeagent"
    description: "Terminal-native AI coding agent built with Go"
    license: MIT
    install: |
      bin.install "aicodeagent"
    post_install: |
      bash_completion.install "aicodeagent.bash"
      zsh_completion.install "aicodeagent.zsh"
      fish_completion.install "aicodeagent.fish"
    test: |
      system "#{bin}/aicodeagent --version"
